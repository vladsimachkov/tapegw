name: ci

on:
  push:
    branches: [main]
  pull_request:

# Правило 2 из AGENTS.md: go build ./... && go test ./... проходят на любом
# Linux без Phobos и без cgo. Всё, что требует Phobos, — отдельным джобом
# со стендом ci-dir (появится на M0).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Версия берётся из go.mod (1.26.0, как у versitygw)
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "не отформатировано gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Версия закреплена: @latest может принести новые проверки в любой день,
        # и тогда CI краснеет без изменений в коде. v0.8.2 понимает Go 1.26.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: go mod tidy не оставил изменений
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum устарели — выполните go mod tidy локально"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер, а не мы. Фиксированный «55432:5432» ловит гонку
        # за ресурс хоста: на общего раннера уже кто-то держит этот порт, и
        # контейнер не поднимается с «address already in use». Тесты при этом
        # вообще не запускаются, а retry такую поломку только прячет.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Порт пустым быть не может, но если выражение развалится, DSN станет
      # «localhost:/phobos» и падение будет совсем не про то.
      - name: postgres ready
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          echo "postgres на порту ${TAPEGW_PG_PORT}"
        env:
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports['5432'] }}

      - name: unit + integration
        env:
          TAPEGW_TEST_DSN: postgres://tapegw:tapegw@localhost:${{ job.services.postgres.ports['5432'] }}/phobos?search_path=tapegw_test
        run: go test -race -count=1 ./...

  # E2E против живого tapegw: критерий готовности M1 — aws s3 mb / ls / rb.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер — см. комментарий в джобе test.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TAPEGW_PG_PORT: ${{ job.services.postgres.ports['5432'] }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build tapegw
        run: go build -o /tmp/tapegw ./cmd/tapegw

      - name: start tapegw
        env:
          TAPEGW_ROOT_ACCESS: ci-access
          TAPEGW_ROOT_SECRET: ci-secret
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          mkdir -p /tmp/spool/landing /tmp/spool/cache
          # Heredoc без кавычек: нужен подстанов port'а. В теле других $
          # нет, и добавлять их сюда не следует — иначе начнут раскрываться.
          cat > /tmp/ci.yaml <<YAML
          s3:
            listen: [":7070"]
          db:
            dsn: postgres://tapegw:tapegw@localhost:${TAPEGW_PG_PORT}/phobos?search_path=tapegw_ci
          spool:
            landing: /tmp/spool/landing
            cache: /tmp/spool/cache
          YAML
          /tmp/tapegw -config /tmp/ci.yaml &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7070/health >/dev/null && exit 0
            sleep 1
          done
          echo "tapegw не поднялся"; exit 1

      - name: e2e
        env:
          TAPEGW_E2E_ENDPOINT: http://127.0.0.1:7070
          TAPEGW_E2E_ACCESS: ci-access
          TAPEGW_E2E_SECRET: ci-secret
        run: go test -count=1 ./test/e2e -v

  # Сборка с тегом phobos требует EL9 и исходников Phobos — это стенд ci-dir,
  # он появляется на M0. До M0 джоб сознательно не включён: иначе он вечно
  # красный и перестает что-то означать.
  #
  # TODO(M0): контейнер EL9, сборка Phobos + LTFS, go build -tags phobos ./...
