# Минимальный конфиг Phobos для ci-dir: только семейство dir, без TLC и лент.
# Ключи сверены с рабочим конфигом стенда (docs/ops/tape-library.md).

[dss]
connect_string = dbname=phobos host=127.0.0.1 user=phobos password=phobos

# sync_* Phobos разбирает по семействам; с одним dir= демон падал на
# инициализации планировщика (EINVAL), поэтому строки оставлены в полной форме,
# как в рабочем конфиге стенда, даже если rados_pool не используется.
[lrs]
server_socket = /tmp/socklrs
sync_time_ms = tape=10000,dir=10,rados_pool=10
sync_nb_req = tape=1,dir=1,rados_pool=5
sync_wsize_kb = tape=1048576,dir=1048576,rados_pool=1048576

[store]
fs_root = /var/lib/phobos
default_dir_library = dirlib

[profile "simple"]
family = dir
layout = raid1
lyt-params = repl_count=1
library = dirlib
