name: ci

on:
  push:
    branches: [main]
  pull_request:

# Правило 2 из AGENTS.md: go build ./... && go test ./... проходят на любом
# Linux без Phobos и без cgo. Всё, что требует Phobos, — отдельным джобом
# со стендом ci-dir (появится на M0).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Версия берётся из go.mod (1.26.0, как у versitygw)
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "не отформатировано gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Версия закреплена: @latest может принести новые проверки в любой день,
        # и тогда CI краснеет без изменений в коде. v0.8.2 понимает Go 1.26.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: go mod tidy не оставил изменений
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum устарели — выполните go mod tidy локально"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер, а не мы. Фиксированный «55432:5432» ловит гонку
        # за ресурс хоста: на общего раннера уже кто-то держит этот порт, и
        # контейнер не поднимается с «address already in use». Тесты при этом
        # вообще не запускаются, а retry такую поломку только прячет.
        #
        # Порт читается как job.services.postgres.ports[5432] — без id задачи:
        # job.services уже относится к текущей задаче. Форма job.<id>.services
        # синтаксически проходит, но резолвится в пустоту, и DSN становится
        # «localhost:/phobos». Поэтому рядом есть шаг-проверка на пустой порт.
        #
        # Выражение допустимо только на уровне шага: в jobs.<id>.env контекста
        # job нет, и файл workflow целиком не проходит валидацию — прогоны
        # заводятся без единого джоба и без внятного сообщения.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Порт пустым быть не может, но если выражение развалится, DSN станет
      # «localhost:/phobos» и падение будет совсем не про то.
      - name: postgres ready
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          echo "postgres на порту ${TAPEGW_PG_PORT}"
        env:
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: unit + integration
        env:
          TAPEGW_TEST_DSN: postgres://tapegw:tapegw@localhost:${{ job.services.postgres.ports[5432] }}/phobos?search_path=tapegw_test
        # -json, а не голый вывод: при ./... с параллельными пакетами имя
        # упавшего теста тонет в перемешанном логе, а `exit status N` и блоки
        # `DATA RACE` и вовсе остаются за кадром. Сводка ниже называет виновника
        # явно; полный JSON — артефакт прогона.
        run: |
          set +e
          go test -race -count=1 -json ./... > /tmp/gotest.json 2>&1
          rc=$?
          set -e
          # Сводка не должна превращать зелёный прогон в красный и гасить
          # настоящий код возврата: если она сама упала, говорим об этом
          # отдельно и выходим по rc go test.
          python3 hack/testsummary.py /tmp/gotest.json || echo "::warning::сводка не построилась"
          exit $rc

      - name: gotest JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotest-json
          path: /tmp/gotest.json
          if-no-files-found: ignore
          retention-days: 7

  # E2E против живого tapegw: критерий готовности M1 — aws s3 mb / ls / rb.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер — см. комментарий в джобе test.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build tapegw
        run: go build -o /tmp/tapegw ./cmd/tapegw

      - name: start tapegw
        env:
          TAPEGW_ROOT_ACCESS: ci-access
          TAPEGW_ROOT_SECRET: ci-secret
          # Порт читается только на уровне шага — см. комментарий в джобе test.
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          mkdir -p /tmp/spool/landing /tmp/spool/cache
          # Учётки — из Postgres (iam.kek_file), а не из s3.iam_dir: по плану T1
          # файловый IAM из конфига уходит, и держать рядом второй стенд означало
          # бы, что основной e2e не трогает IAMService вообще.
          #
          # Файл KEK: JSON вида {"1": "<base64>", ...}, права строго 0600/0400 —
          # LoadKeyRing иначе отказывается. Версий две сразу: активна 1, вторая
          # нужна шагу ротации.
          umask 077
          printf '{"1":"%s","2":"%s"}\n' \
            "$(head -c 32 /dev/urandom | base64 -w0)" \
            "$(head -c 32 /dev/urandom | base64 -w0)" > /tmp/kek.json
          chmod 600 /tmp/kek.json
          # Heredoc без кавычек: нужен подстанов port'а. В теле других $
          # нет, и добавлять их сюда не следует — иначе начнут раскрываться.
          cat > /tmp/ci.yaml <<YAML
          s3:
            listen: [":7070"]
            health_path: /health
          iam:
            kek_file: /tmp/kek.json
            kek_version: 1
          db:
            dsn: postgres://tapegw:tapegw@localhost:${TAPEGW_PG_PORT}/phobos?search_path=tapegw_ci
          spool:
            landing: /tmp/spool/landing
            cache: /tmp/spool/cache
          # Phobos в CI нет, mover подключить нечем. migrator по умолчанию
          # включён, а его старт-гейт (PlanMigrators) роняет процесс на
          # «включено, но некому»: с #119 стенд не поднимал шлюз вовсе, и весь
          # e2e был красным. Стенд выключает его явно — молчание здесь
          # означало бы «включено». S6 даёт стенду Phobos dir и mover, и
          # выключение снимается. janitor ленту не требует — пусть работает.
          migrator:
            enabled: false
          YAML
          /tmp/tapegw -config /tmp/ci.yaml &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7070/health >/dev/null && exit 0
            sleep 1
          done
          echo "tapegw не поднялся"; exit 1

      # Тенант 2 (ADR-0018): строки о клиентских тенантах — это данные, а не
      # схема, поэтому миграция заводит только системный тенант 1, а админ-API
      # для создания тенантов появится на T4. До него стенд заводит тенант сам:
      # без строки в tenants вставка бакета в тенант 2 упала бы на FK.
      #
      # Шаг обязан идти ПОСЛЕ старта tapegw: схему tapegw_ci создаёт применение
      # миграций на старте процесса.
      #
      # psql берётся из контейнера сервиса, а не с раннера: клиент Postgres на
      # образах раннеров меняется от версии к версии, а docker есть всегда —
      # через него и поднимаются services. Контейнер ищется по опубликованному
      # порту, который раннер вернул в job.services.postgres.ports.
      # Тенанты и учётки стенда. Строки о клиентских тенантах — это данные, а не
      # схема: миграция заводит только системный тенант 1, админ-API для
      # тенантов появится на T4. Шаг идёт ПОСЛЕ старта tapegw, потому что схему
      # tapegw_ci создаёт применение миграций на старте процесса.
      #
      # Учётки заводятся tapegw-iamctl, а не SQL: секрет должен заворачиваться тем
      # же кольцом KEK и с той же AAD, что читает tapegw. SQL-сид мог бы
      # вставить нечитаемую обёртку, и стенд молча жил бы без учёток.
      #
      # Роли разные намеренно: бакет создаёт userplus — единственная не-admin роль,
      # которой versitygw разрешает CreateBucket без identity-политик
      # (access-control.go:597). Обычный user берёт права только из политики
      # бакета — это и есть сценарий клиента: два ключа одного тенанта.
      #
      # usert3 — ключ ВТОРОГО клиентского тенанта: он нужен тесту, где единственный
      # барьер — страж тенанта (находка 1 к PR#2a).
      - name: seed tenants and accounts
        env:
          TAPEGW_ROOT_ACCESS: ci-access
          TAPEGW_ROOT_SECRET: ci-secret
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          cid=$(docker ps -q --filter "publish=${TAPEGW_PG_PORT}" | head -1)
          if [ -z "${cid}" ]; then
            echo "не нашли контейнер postgres на порту ${TAPEGW_PG_PORT}"; exit 1
          fi
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U tapegw -d phobos -c \
            "SET search_path TO tapegw_ci;
             INSERT INTO tenants (id, name, status, pool_id)
             VALUES (2, 'ci-client', 'active', 1), (3, 'ci-client-2', 'active', 1)
             ON CONFLICT (id) DO NOTHING"
          for spec in "userplus:usersecret:userplus:2" "userplain:userplainsecret:user:2" "usert3:usert3secret:user:3"; do
            IFS=: read -r acc sec rol ten <<< "$spec"
            go run ./cmd/tapegw-iamctl -config /tmp/ci.yaml -cmd create \
              -access "$acc" -secret "$sec" -role "$rol" -tenant "$ten"
          done
          go run ./cmd/tapegw-iamctl -config /tmp/ci.yaml -cmd list

      - name: e2e
        env:
          TAPEGW_E2E_ENDPOINT: http://127.0.0.1:7070
          TAPEGW_E2E_ACCESS: ci-access
          TAPEGW_E2E_SECRET: ci-secret
          # Обычный ключ: без него тесты доступа пропускаются, а не падают.
          # userplain — роль user, права только из политики бакета.
          TAPEGW_E2E_USER_ACCESS: userplain
          TAPEGW_E2E_USER_SECRET: userplainsecret
          # Ключ того же тенанта 2, который умеет создавать бакеты и выдавать
          # права: без него проверка «политика разрешает» строилась бы на бакете
          # системного тенанта.
          TAPEGW_E2E_OWNER_ACCESS: userplus
          TAPEGW_E2E_OWNER_SECRET: usersecret
          # Ключ ВТОРОГО клиентского тенанта: нужен тесту, где единственный
          # барьер — страж (находка 1 к PR#2a).
          TAPEGW_E2E_FOREIGN_ACCESS: usert3
          TAPEGW_E2E_FOREIGN_SECRET: usert3secret
          # Прямое подключение к базе стенда: тесту нужно записать ACL и
          # политику мимо API.
          TAPEGW_E2E_DSN: postgres://tapegw:tapegw@localhost:${{ job.services.postgres.ports[5432] }}/phobos?search_path=tapegw_ci
          # В CI тесты доступа не имеют права скипаться: молчаливый Skip —
          # это зелёный прогон, который ничего не проверяет (на PR#2a на
          # этом и поймались).
          TAPEGW_REQUIRE_ACCESS_TESTS: "1"
          # Кольцо KEK стенда: нужно тесту отзыва ключа на живом шлюзе.
          TAPEGW_E2E_KEK_FILE: /tmp/kek.json
          TAPEGW_E2E_KEK_VERSION: "1"
        run: go test -count=1 ./test/e2e -v

  # Сборка с тегом phobos требует EL9 и исходников Phobos — это стенд ci-dir,
  # он появляется на M0. До M0 джоб сознательно не включён: иначе он вечно
  # красный и перестает что-то означать.
  #
  # TODO(M0): контейнер EL9, сборка Phobos + LTFS, go build -tags phobos ./...
