name: ci

on:
  push:
    branches: [main]
  pull_request:

# Правило 2 из AGENTS.md: go build ./... && go test ./... проходят на любом
# Linux без Phobos и без cgo. Всё, что требует Phobos, — отдельным джобом
# со стендом ci-dir (появится на M0).

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Версия берётся из go.mod (1.26.0, как у versitygw)
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "не отформатировано gofmt:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        # Версия закреплена: @latest может принести новые проверки в любой день,
        # и тогда CI краснеет без изменений в коде. v0.8.2 понимает Go 1.26.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: go mod tidy не оставил изменений
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum устарели — выполните go mod tidy локально"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер, а не мы. Фиксированный «55432:5432» ловит гонку
        # за ресурс хоста: на общего раннера уже кто-то держит этот порт, и
        # контейнер не поднимается с «address already in use». Тесты при этом
        # вообще не запускаются, а retry такую поломку только прячет.
        #
        # Порт читается как job.services.postgres.ports[5432] — без id задачи:
        # job.services уже относится к текущей задаче. Форма job.<id>.services
        # синтаксически проходит, но резолвится в пустоту, и DSN становится
        # «localhost:/phobos». Поэтому рядом есть шаг-проверка на пустой порт.
        #
        # Выражение допустимо только на уровне шага: в jobs.<id>.env контекста
        # job нет, и файл workflow целиком не проходит валидацию — прогоны
        # заводятся без единого джоба и без внятного сообщения.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Порт пустым быть не может, но если выражение развалится, DSN станет
      # «localhost:/phobos» и падение будет совсем не про то.
      - name: postgres ready
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          echo "postgres на порту ${TAPEGW_PG_PORT}"
        env:
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}

      - name: unit + integration
        env:
          TAPEGW_TEST_DSN: postgres://tapegw:tapegw@localhost:${{ job.services.postgres.ports[5432] }}/phobos?search_path=tapegw_test
        run: go test -race -count=1 ./...

  # E2E против живого tapegw: критерий готовности M1 — aws s3 mb / ls / rb.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tapegw
          POSTGRES_PASSWORD: tapegw
          POSTGRES_DB: phobos
        # Порт выбирает раннер — см. комментарий в джобе test.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U tapegw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build tapegw
        run: go build -o /tmp/tapegw ./cmd/tapegw

      - name: start tapegw
        env:
          TAPEGW_ROOT_ACCESS: ci-access
          TAPEGW_ROOT_SECRET: ci-secret
          # Порт читается только на уровне шага — см. комментарий в джобе test.
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          mkdir -p /tmp/spool/landing /tmp/spool/cache /tmp/iam
          # Файловый IAM: без него versitygw живёт в режиме одной учётки и
          # знает только root, а проверки доступа на root не проверяются вовсе
          # (root и admin идут мимо политик и ACL).
          #
          # Обе учётки — в тенанте 2, клиентском (ADR-0018). В системном тенанте
          # 1 проверять нечего: страж (ADR-0017) отказывает не-admin учётке
          # системного тенанта, и тест «политика разрешает» проверял бы отказ
          # стража вместо политики.
          #
          # Роли разные намеренно: бакет создаёт userplus — единственная не-admin
          # роль, которой versitygw разрешает CreateBucket без identity-политик
          # (access-control.go:597, для бэкендов без PolicyEvaluator). Обычный
          # user бакет создать не может, и его права берутся только из политики
          # бакета — это и есть проверяемый сценарий клиента: два ключа одного
          # тенанта.
          cat > /tmp/iam/users.json <<'JSON'
          {"accessAccounts":{
            "userplus":{"access":"userplus","secret":"usersecret","role":"userplus","userID":1001,"groupID":1001,"projectID":2},
            "userplain":{"access":"userplain","secret":"userplainsecret","role":"user","userID":1002,"groupID":1002,"projectID":2}
          }}
          JSON
          # Heredoc без кавычек: нужен подстанов port'а. В теле других $
          # нет, и добавлять их сюда не следует — иначе начнут раскрываться.
          cat > /tmp/ci.yaml <<YAML
          s3:
            listen: [":7070"]
            iam_dir: /tmp/iam
            health_path: /health
          db:
            dsn: postgres://tapegw:tapegw@localhost:${TAPEGW_PG_PORT}/phobos?search_path=tapegw_ci
          spool:
            landing: /tmp/spool/landing
            cache: /tmp/spool/cache
          YAML
          /tmp/tapegw -config /tmp/ci.yaml &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7070/health >/dev/null && exit 0
            sleep 1
          done
          echo "tapegw не поднялся"; exit 1

      # Тенант 2 (ADR-0018): строки о клиентских тенантах — это данные, а не
      # схема, поэтому миграция заводит только системный тенант 1, а админ-API
      # для создания тенантов появится на T4. До него стенд заводит тенант сам:
      # без строки в tenants вставка бакета в тенант 2 упала бы на FK.
      #
      # Шаг обязан идти ПОСЛЕ старта tapegw: схему tapegw_ci создаёт применение
      # миграций на старте процесса.
      #
      # psql берётся из контейнера сервиса, а не с раннера: клиент Postgres на
      # образах раннеров меняется от версии к версии, а docker есть всегда —
      # через него и поднимаются services. Контейнер ищется по опубликованному
      # порту, который раннер вернул в job.services.postgres.ports.
      - name: seed tenant 2
        env:
          TAPEGW_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          if [ -z "${TAPEGW_PG_PORT}" ]; then
            echo "раннер не вернул порт postgres"; exit 1
          fi
          cid=$(docker ps -q --filter "publish=${TAPEGW_PG_PORT}" | head -1)
          if [ -z "${cid}" ]; then
            echo "не нашли контейнер postgres на порту ${TAPEGW_PG_PORT}"; exit 1
          fi
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U tapegw -d phobos -c \
            "SET search_path TO tapegw_ci;
             INSERT INTO tenants (id, name, status, pool_id)
             VALUES (2, 'ci-client', 'active', 1) ON CONFLICT (id) DO NOTHING"

      - name: e2e
        env:
          TAPEGW_E2E_ENDPOINT: http://127.0.0.1:7070
          TAPEGW_E2E_ACCESS: ci-access
          TAPEGW_E2E_SECRET: ci-secret
          # Обычный ключ: без него тесты доступа пропускаются, а не падают.
          # userplain — роль user, права только из политики бакета.
          TAPEGW_E2E_USER_ACCESS: userplain
          TAPEGW_E2E_USER_SECRET: userplainsecret
          # Ключ того же тенанта 2, который умеет создавать бакеты и выдавать
          # права: без него проверка «политика разрешает» строилась бы на бакете
          # системного тенанта.
          TAPEGW_E2E_OWNER_ACCESS: userplus
          TAPEGW_E2E_OWNER_SECRET: usersecret
        run: go test -count=1 ./test/e2e -v

  # Сборка с тегом phobos требует EL9 и исходников Phobos — это стенд ci-dir,
  # он появляется на M0. До M0 джоб сознательно не включён: иначе он вечно
  # красный и перестает что-то означать.
  #
  # TODO(M0): контейнер EL9, сборка Phobos + LTFS, go build -tags phobos ./...
